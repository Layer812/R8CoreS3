; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-cores3]
; Keep the official Arduino 2.0.17 platform (do not pick locally installed pioarduino 55.x).
; Unpinned 'espressif32' can resolve to an incompatible 55.x platform with missing FRAMEWORK_DIR.
platform = platformio/espressif32@6.12.0
board = m5stack-cores3
framework = arduino
board_build.f_cpu = 240000000L
board_build.partitions = partitions.csv
build_flags =
    -D ARDUINO_LOOP_STACK_SIZE=32768
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DIS_CARDPUTER
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -Wdouble-promotion
    -O3
    -funroll-loops
    -fno-exceptions
    -I src/data
    -I src/lodepng
    -I src/lua
    -I src/lexaloffle
lib_deps =
    ; Keep the verified 0.2.x M5Unified + M5GFX API pair; no automatic 0.3.0.
    m5stack/M5Unified@0.2.28
    m5stack/M5GFX@0.2.35
    adafruit/Adafruit NeoPixel@1.15.5
    https://github.com/kikuchan/pngle.git
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<*> -<db_installer.cpp>